<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sufiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="sufiBronze" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- 8-Pointed Sufi Star (Rub el Hizb) cutout ring spanning 0..100 edge-to-edge with transparent background -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M50 0 L64.64 14.64 L85.36 14.64 L85.36 35.36 L100 50 L85.36 64.64 L85.36 85.36 L64.64 85.36 L50 100 L35.36 85.36 L14.64 85.36 L14.64 64.64 L0 50 L14.64 35.36 L14.64 14.64 L35.36 14.64 Z M50 10 L61.5 21.5 L78.5 21.5 L78.5 38.5 L90 50 L78.5 61.5 L78.5 78.5 L61.5 78.5 L50 90 L38.5 78.5 L21.5 78.5 L21.5 61.5 L10 50 L21.5 38.5 L21.5 21.5 L38.5 21.5 Z"
    fill="url(#sufiGold)"
  />
  <!-- Whirling Dervish robe & arms filling the star interior -->
  <path
    d="M50 14 C57 29, 77 39, 86 53 C72 58, 61 52, 50 47 C39 52, 28 58, 14 53 C23 39, 43 29, 50 14 Z"
    fill="url(#sufiGold)"
  />
  <path
    d="M15 76 C31 58, 69 58, 85 76 C68 85, 32 85, 15 76 Z"
    fill="url(#sufiBronze)"
  />
  <!-- Diagonal Reed-Flute (Ney) from bottom-left corner (6,94) to top-right corner (94,6) -->
  <path
    d="M8 92 L92 8"
    stroke="#FDE68A"
    stroke-width="8"
    stroke-linecap="round"
  />
  <circle cx="36" cy="64" r="2.6" fill="#78350F" />
  <circle cx="50" cy="50" r="2.6" fill="#78350F" />
  <circle cx="64" cy="36" r="2.6" fill="#78350F" />
</svg>
